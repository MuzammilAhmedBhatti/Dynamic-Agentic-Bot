{{- if eq .Values.secrets.provider "gcp" }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.secretProviderClassName }}
  labels: {{- include "dynamic-agentic.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "secrets.gcpProjectId is required" .Values.secrets.gcpProjectId }}/secrets/{{ .Values.secrets.databaseUrlSecret }}/versions/latest"
        path: "database-url"
      - resourceName: "projects/{{ .Values.secrets.gcpProjectId }}/secrets/{{ .Values.secrets.pineconeApiKeySecret }}/versions/latest"
        path: "pinecone-api-key"
      - resourceName: "projects/{{ .Values.secrets.gcpProjectId }}/secrets/{{ .Values.secrets.encryptionKeySecret }}/versions/latest"
        path: "data-source-encryption-key"
{{- end }}
