apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata:
      labels: {app: prometheus}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: prometheus
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=3d"]
          ports: [{name: http, containerPort: 9090}]
          resources: {{- toYaml .Values.prometheus.resources | nindent 12 }}
          securityContext: &secure {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: config, mountPath: /etc/prometheus, readOnly: true}, {name: data, mountPath: /prometheus}]
      volumes: [{name: config, configMap: {name: prometheus-config}}, {name: data, emptyDir: {sizeLimit: 2Gi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, runAsGroup: 472, fsGroup: 472, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.grafana.adminSecretName }}, key: password}}
          ports: [{name: http, containerPort: 3000}]
          resources: {{- toYaml .Values.grafana.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml, readOnly: true}
            - {name: provisioning, mountPath: /var/lib/grafana/dashboards/dynamic-agentic.json, subPath: dynamic-agentic.json, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
      volumes: [{name: provisioning, configMap: {name: grafana-provisioning}}, {name: data, emptyDir: {sizeLimit: 512Mi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: collector
          image: {{ .Values.otel.image }}
          args: ["--config=/etc/otel/config.yaml"]
          ports: [{name: grpc, containerPort: 4317}, {name: http, containerPort: 4318}]
          resources: {{- toYaml .Values.otel.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: config, mountPath: /etc/otel, readOnly: true}]
      volumes: [{name: config, configMap: {name: otel-config}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: elasticsearch}
spec:
  replicas: 1
  selector: {matchLabels: {app: elasticsearch}}
  template:
    metadata: {labels: {app: elasticsearch}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: elasticsearch
          image: {{ .Values.elasticsearch.image }}
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "false"}
            - {name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
          ports: [{name: http, containerPort: 9200}]
          resources: {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: data, mountPath: /usr/share/elasticsearch/data}]
      volumes: [{name: data, emptyDir: {sizeLimit: 4Gi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: logstash}
spec:
  replicas: 1
  selector: {matchLabels: {app: logstash}}
  template:
    metadata:
      labels: {app: logstash}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: logstash
          image: {{ .Values.logstash.image }}
          args: ["-f", "/usr/share/logstash/pipeline/pipeline.conf"]
          env: [{name: LS_JAVA_OPTS, value: "-Xms256m -Xmx256m"}]
          ports: [{name: beats, containerPort: 5044}]
          startupProbe: {tcpSocket: {port: beats}, failureThreshold: 120, periodSeconds: 2}
          readinessProbe: {tcpSocket: {port: beats}, periodSeconds: 10}
          resources: {{- toYaml .Values.logstash.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: config, mountPath: /usr/share/logstash/config/logstash.yml, subPath: logstash.yml, readOnly: true}
            - {name: config, mountPath: /usr/share/logstash/pipeline/pipeline.conf, subPath: pipeline.conf, readOnly: true}
      volumes: [{name: config, configMap: {name: logstash-config}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kibana}
spec:
  replicas: 1
  selector: {matchLabels: {app: kibana}}
  template:
    metadata: {labels: {app: kibana}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: kibana
          image: {{ .Values.kibana.image }}
          env: [{name: ELASTICSEARCH_HOSTS, value: http://elasticsearch:9200}]
          ports: [{name: http, containerPort: 5601}]
          resources: {{- toYaml .Values.kibana.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
