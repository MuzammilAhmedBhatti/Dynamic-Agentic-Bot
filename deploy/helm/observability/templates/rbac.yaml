apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: dynamic-agentic-prometheus}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: dynamic-agentic-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: dynamic-agentic-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: observability}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: filebeat}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: dynamic-agentic-filebeat}
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: dynamic-agentic-filebeat}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: dynamic-agentic-filebeat}
subjects: [{kind: ServiceAccount, name: filebeat, namespace: observability}]
