name: dynamic-agentic-bot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dynamic_agentic}
      POSTGRES_USER: ${POSTGRES_USER:-dynamic_agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - dynamic-agentic-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  dynamic-agentic-postgres:
