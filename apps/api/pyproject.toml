[project]
name = "dynamic-agentic-api"
version = "0.1.0"
description = "Secure Phase 1 API foundation for Dynamic Agentic Bot"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=50,<51",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "google-genai>=1.0,<3",
  "google-cloud-storage>=3.3,<4",
  "langgraph>=1.0,<2",
  "pinecone>=7,<9",
  "prometheus-client>=0.22,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.20,<1",
  "scikit-learn>=1.7,<2",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "sqlglot>=27,<29",
  "structlog>=25.4,<26",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
  "opentelemetry-sdk>=1.38,<2",
  "torch>=2.7,<3",
  "transformers>=4.55,<6",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/dynamic_agentic_api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["../../tests/backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "../../tests/backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dynamic_agentic_api"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "sklearn.*", "google.cloud.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pymupdf",
    "pymupdf.*",
    "sqlglot",
    "sqlglot.*",
    "dynamic_agentic_api.ingestion.pdf",
    "dynamic_agentic_api.data_sources.security",
]
disallow_untyped_calls = false
